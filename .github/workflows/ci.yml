# PR 校验流水线（ADR-0018 第一层触发晋升）
# 范围：lint + type-check + Vitest 单测（ADR-0012）+ Vitest 集成测试（真实 PG/Redis）
# + Playwright E2E 冒烟（ADR-0017）+ 生产构建。
# 不推镜像、不部署、零机密接触（ADR-0022 分界）：services 凭据与 BETTER_AUTH_SECRET
# 均为 CI 专用占位值（同 compose.dev.yaml 本地开发凭据），不引用任何 environment secret；
# fork PR 同样可触发，机密接触面为零。
name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & Type-check & Test & Build
    runs-on: ubuntu-latest
    # services 容器与 compose.dev.yaml 同镜像同凭据（Task 13）。
    # VM runner 上 steps 直接跑在宿主，service 容器别名 DNS 不可从宿主解析，
    # 按 GitHub 官方文档惯例以 localhost + 显式 ports 映射访问。
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: studybuddy
          POSTGRES_PASSWORD: studybuddy
          POSTGRES_DB: studybuddy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studybuddy -d studybuddy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # CI 无 .env 上下文：env 在 job 级注入，Build / 单测 / 集成 / E2E 各步骤继承
    # （Playwright webServer 的 build && start 同样读 job env）。
    # BETTER_AUTH_SECRET 为 CI 专用随机串，非生产机密（ADR-0022 不破）。
    env:
      DATABASE_URL: postgresql://studybuddy:studybuddy@localhost:5432/studybuddy
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-a3f8e21c94b7d60518e2f4a9c3b1d7e8065f2c4a9b8d3e1f7a5c0b9d8e2f4a31
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # 生成 Next.js 路由/布局全局类型（LayoutProps 等位于 .next/types，gitignored），
      # 全新 checkout 上必须先生成，Type-check 才能通过（next typegen 秒级完成）
      - name: Type definitions
        run: npx next typegen

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

      # P2 测试层：Vitest 单测（ADR-0012）
      - name: Unit tests (Vitest)
        run: npm run test

      # P2 测试层：Vitest 集成测试（真实 PG/Redis services），
      # 迁移由其 globalSetup 自理（drizzle migrator 应用 src/db/migrations）
      - name: Integration tests (Vitest)
        run: npm run test:integration

      # E2E 需要 Chromium 二进制，runner 预装环境不含 Playwright 浏览器，需单独安装；
      # --with-deps 一并装系统依赖（ubuntu runner 具备 sudo），不引入浏览器缓存（ADR-0017 MVP 从简）
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # E2E 前显式应用迁移（不依赖集成测试步骤已跑过 globalSetup 的隐式顺序）
      - name: Database migrate
        run: npm run db:migrate

      # P2 测试层：Playwright E2E 冒烟（ADR-0017），对生产构建产物跑（webServer 自动 build && start）
      - name: Playwright E2E
        run: npm run test:e2e

  # 镜像可构建性校验（CI/CD 阶段 1，ADR-0016 standalone 镜像）：
  # 只构建不推送、零机密接触，与 verify 并行互不阻塞。
  # check 名「Docker build」已录入 master 分支保护必需检查，构建失败阻断合并。
  # MVP 从简不用 buildx 缓存；部署流水线（deploy.yml）同款构建，缓存待有真实瓶颈再评估。
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build app image
        run: docker build --target runner -t studybuddy-app:pr .
