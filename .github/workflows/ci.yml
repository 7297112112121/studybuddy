# PR 校验流水线(ADR-0018 第一层触发晋升;变更裁剪见 ADR-0026)
# 范围:lint + type-check + Vitest 单测(ADR-0012)+ Vitest 集成测试(真实 PG/Redis)
# + Playwright E2E 冒烟(ADR-0017)+ 生产构建。
# 不推镜像、不部署、零机密接触(ADR-0022 分界):services 凭据与 BETTER_AUTH_SECRET
# 均为 CI 专用占位值(同 compose.dev.yaml 本地开发凭据),不引用任何 environment secret;
# fork PR 同样可触发,机密接触面为零。
# ADR-0026:docs-only 变更(code=false)时 verify / docker 以 job 级 if 跳过——
# 跳过的必需检查计为通过(需在分支保护实测,ADR-0026 风险项);兜底原则:未命中
# 显式「无影响」清单一律全跑(宁漏跳、不漏跑),判定见 .github/paths-filter.yml。
name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ADR-0026 变更检测作业:最先执行,零机密、只读权限。过滤器单源
  # .github/paths-filter.yml,跳过判定取合取 docs==true && code==false
  # (兜底原则:未命中显式「无影响」清单一律全跑)。
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code || steps.force.outputs.code }}
      docs: ${{ steps.filter.outputs.docs || steps.force.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changes
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4(ADR-0022 例外,ADR-0026 钉完整 SHA)
        with:
          filters: .github/paths-filter.yml
          list-files: json
          # 默认 some 模式是纯 OR,取反模式不生效(钉版源码 filter.ts:createRuleItem
          # 只在该量化器下区分极性);code 过滤器的 catch-all + 排除语义必须显式声明
          predicate-quantifier: some-with-excludes

      # 手动触发无 push diff 可判定,直接全跑(本 workflow 无 dispatch 入口,
      # 此步为防御性兜底;deploy.yml 的同名逻辑是回滚重放通道的真依赖)
      - name: Dispatch forces full run
        id: force
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "code=true" >> "$GITHUB_OUTPUT"
          echo "docs=false" >> "$GITHUB_OUTPUT"

      # 决策留痕(ADR-0026 决策 4):输出与命中文件清单进 job summary,可审计可复盘
      - name: Record decision in job summary
        if: always()
        env:
          CODE: ${{ steps.filter.outputs.code || steps.force.outputs.code }}
          DOCS: ${{ steps.filter.outputs.docs || steps.force.outputs.docs }}
          CODE_FILES: ${{ steps.filter.outputs.code_files }}
          DOCS_FILES: ${{ steps.filter.outputs.docs_files }}
        run: |
          {
            echo "## 变更检测(ADR-0026)"
            echo ""
            echo "| 过滤器 | 命中 |"
            echo "| --- | --- |"
            echo "| code(app 相关,catch-all) | $CODE |"
            echo "| docs(无影响清单) | $DOCS |"
            echo ""
            echo "判定:code=true → 全量校验;code=false(docs-only,合取 docs=true && code=false)→ 跳过 verify/docker"
            echo ""
            echo "docs 命中文件: $DOCS_FILES"
            echo ""
            echo "code 命中文件: $CODE_FILES"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Lint & Type-check & Test & Build
    needs: changes
    # ADR-0026:仅 docs-only 变更跳过;任何 app 相关路径(含未入清单的新路径)都命中 code → 全跑
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # services 容器与 compose.dev.yaml 同镜像同凭据（Task 13）。
    # VM runner 上 steps 直接跑在宿主，service 容器别名 DNS 不可从宿主解析，
    # 按 GitHub 官方文档惯例以 localhost + 显式 ports 映射访问。
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: studybuddy
          POSTGRES_PASSWORD: studybuddy
          POSTGRES_DB: studybuddy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studybuddy -d studybuddy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # CI 无 .env 上下文：env 在 job 级注入，Build / 单测 / 集成 / E2E 各步骤继承
    # （Playwright webServer 的 build && start 同样读 job env）。
    # BETTER_AUTH_SECRET 为 CI 专用随机串，非生产机密（ADR-0022 不破）。
    env:
      DATABASE_URL: postgresql://studybuddy:studybuddy@localhost:5432/studybuddy
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-a3f8e21c94b7d60518e2f4a9c3b1d7e8065f2c4a9b8d3e1f7a5c0b9d8e2f4a31
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      # node_modules 直接缓存（绕过 npm ci 的全量重装）：npm ci 即使 ~/.npm
      # 包缓存命中也要解包 1905 个包（实测 ~29s），缓存 node_modules 后命中
      # 运行跳过安装、秒级通过；未命中回退 npm ci 并回填。
      # save 拆为独立步骤且以 install 成功为前提——actions/cache 默认 post
      # 保存不感知步骤成败，会把半成品 node_modules 写进缓存毒化后续运行。
      # key 仅含 runner.os + lockfile：平台特定二进制（esbuild/@swc/core 等）
      # 按 OS 区分，lockfile 变更自动重建。
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Save node_modules cache
        if: steps.node-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # P0 门禁:Prettier 全仓格式检查(.prettierignore 排除 docs/website 等文档目录)。
      # 零外部服务依赖,置于 lint 之前快速失败。
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # 生成 Next.js 路由/布局全局类型（LayoutProps 等位于 .next/types，gitignored），
      # 全新 checkout 上必须先生成，Type-check 才能通过（next typegen 秒级完成）
      - name: Type definitions
        run: npx next typegen

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

      # P2 测试层：Vitest 单测（ADR-0012）
      - name: Unit tests (Vitest)
        run: npm run test

      # P2 测试层：Vitest 集成测试（真实 PG/Redis services），
      # 迁移由其 globalSetup 自理（drizzle migrator 应用 src/db/migrations）
      - name: Integration tests (Vitest)
        run: npm run test:integration

      # E2E 需要 Chromium 二进制，runner 预装环境不含 Playwright 浏览器，需单独安装。
      # --with-deps 在 runner 上缺的仅字体/xfonts 包（~22MB），但 runner 到 ubuntu
      # 镜像源吞吐波动剧烈（实测 19MB/s ~ 75KB/s，最差一次 4m52s），故缓存 apt
      # 已下载的 .deb：安装前注入 apt archives，apt 对本地命中的包跳过下载。
      # 边界说明：缓存的是 apt 系统依赖，不是 Playwright 浏览器本体——浏览器走
      # 官方 CDN 恒定秒级，ADR-0017「不引入浏览器缓存」决策维持不变。
      # key 绑定 package-lock：Playwright 升级 → 依赖清单变 → 自动重建；未命中
      # 回退正常下载，无失败风险。
      - name: Cache Playwright apt deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # runner 用户对 /var/cache/apt/archives 无写权限，缓存落用户目录，
          # 由下方两步 sudo 注入 / 回收（免密 sudo 为 runner 预置）
          path: ~/apt-cache
          key: playwright-apt-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # 命中缓存时把上次下载的 .deb 注入 apt 本地档案目录（cp -n 不覆盖同名）；
      # 首次运行为空集，glob 展开失败由 || true 兜底
      - name: Seed apt cache into archives
        run: sudo cp -n ~/apt-cache/*.deb /var/cache/apt/archives/ || true

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # 回收本次新下载的 .deb 到用户目录（actions/cache 在 job 末尾自动保存该路径）：
      # 首次运行由此步填充缓存，后续命中运行则原样保留
      - name: Collect apt cache
        run: mkdir -p ~/apt-cache && sudo cp -n /var/cache/apt/archives/*.deb ~/apt-cache/ || true

      # E2E 前显式应用迁移（不依赖集成测试步骤已跑过 globalSetup 的隐式顺序）
      - name: Database migrate
        run: npm run db:migrate

      # P2 测试层：Playwright E2E 冒烟（ADR-0017），对生产构建产物跑（webServer 自动 build && start）
      - name: Playwright E2E
        run: npm run test:e2e

  # 镜像可构建性校验（CI/CD 阶段 1，ADR-0016 standalone 镜像）：
  # 只构建不推送、零机密接触，与 verify 并行互不阻塞。
  # check 名「Docker build」已录入 master 分支保护必需检查，构建失败阻断合并。
  # 与 deploy.yml 同款 buildx 构建；仅读 master 的 gha 缓存（PR 无写权限价值，
  # cache-to 留给 master 部署运行统一维护）。
  docker:
    name: Docker build
    needs: changes
    # ADR-0026:与 verify 同判定,docs-only 变更跳过(镜像可构建性与 docs 无关)
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up buildx builder
        run: docker buildx create --use --driver docker-container

      - name: Build app image
        run: >-
          docker buildx build --target runner
          --cache-from type=gha
          --load
          -t studybuddy-app:pr .
