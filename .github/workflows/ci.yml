# PR 校验流水线（ADR-0018 第一层触发晋升）
# 范围：lint + type-check + Vitest 单测（ADR-0012）+ Playwright E2E 冒烟（ADR-0017）+ 生产构建。
# 不推镜像、不部署、零机密接触（ADR-0022 分界）。
# fork PR 同样可触发，本作业不引用任何 environment secret，机密接触面为零。
name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & Type-check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # 生成 Next.js 路由/布局全局类型（LayoutProps 等位于 .next/types，gitignored），
      # 全新 checkout 上必须先生成，Type-check 才能通过（next typegen 秒级完成）
      - name: Type definitions
        run: npx next typegen

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

      # P2 测试层：Vitest 单测（ADR-0012）
      - name: Unit tests (Vitest)
        run: npm run test

      # E2E 需要 Chromium 二进制，runner 预装环境不含 Playwright 浏览器，需单独安装；
      # --with-deps 一并装系统依赖（ubuntu runner 具备 sudo），不引入浏览器缓存（ADR-0017 MVP 从简）
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # P2 测试层：Playwright E2E 冒烟（ADR-0017），对生产构建产物跑（webServer 自动 build && start）
      # Compose 栈（PG / Redis / SeaweedFS）待 ADR-0016 落地后再接入
      - name: Playwright E2E
        run: npm run test:e2e
