# 本地开发专用基础设施(PostgreSQL 17 + Redis 7)
# 注意:仅用于本地开发环境,不属于 ADR-0016 部署拓扑。
# 启动:npm run dev:infra(即 docker compose -f compose.dev.yaml up -d)
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: studybuddy-postgres
    environment:
      POSTGRES_USER: studybuddy
      POSTGRES_PASSWORD: studybuddy
      POSTGRES_DB: studybuddy
    ports:
      - "5432:5432"
    volumes:
      - studybuddy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studybuddy -d studybuddy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: studybuddy-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  studybuddy-pgdata:
