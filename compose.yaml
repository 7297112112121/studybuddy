# 部署编排（ADR-0016）。app + 反向代理两服务；PG / Redis / SeaweedFS 按应用
# 实际接入逐个补齐——拓扑终态仍以 ADR-0016 五服务为准，此为实施顺序而非架构变更。
#
# 镜像来自 TCR（ADR-0020）：APP_IMAGE 由 scripts/deploy.sh 注入
# （ccr.ccs.tencentyun.com/studybuddy/app:<短SHA>）。
# 本地体验：docker build --target runner -t studybuddy-app:local . 后直接 up（默认 tag 兜底）。
#
# dev/test 共居一台服务器（ADR-0018）：以不同 compose project
# （studybuddy-dev / studybuddy-test）+ 不同端口（80/443 与 8080/8443）区分，
# 各自独立的 PG/Redis（compose 内网服务名同名互不冲突，网络按 project 隔离）。
#
# 凭证纪律（ADR-0022）：POSTGRES_PASSWORD 只在服务器本地 .env，
# 不进仓库、不进镜像、不过 CI——compose 插值缺失即 fail-fast。
services:
  app:
    image: ${APP_IMAGE:-studybuddy-app:local}
    restart: unless-stopped
    # 应用机密只经服务器本地 .env 注入（ADR-0016/0022：不进仓库、不进镜像、不过 CI）
    env_file:
      - path: ./.env
        required: false
    # 镜像内已默认 HOSTNAME=0.0.0.0 / PORT=3000，此处显式声明便于运维一眼可见
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    # 只在 compose 内网暴露，公网入口唯一是 caddy（ADR-0016）
    expose:
      - "3000"
    healthcheck:
      # node:alpine 自带 busybox wget；首页探活即可证明 server.js 存活
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # 应用与 DB/Redis 均惰性连接，但 up -d --wait 按此顺序拉起可保证
    # app 就绪时后端已健康（迁移也已在更早的 migrate 步骤应用）
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # 内存限额防共驻互抢（ADR-0018 开发/测试共居 2核4G 的纪律）
          memory: 1g

  postgres:
    # 与 compose.dev.yaml / CI services 同镜像（pgvector 预留向量检索），仅内部暴露
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: studybuddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?缺少 POSTGRES_PASSWORD——请在部署目录的本地 .env 提供（ADR-0022，不进仓库）}
      POSTGRES_DB: studybuddy
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studybuddy -d studybuddy"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    volumes:
      - pg_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 会话缓存/限流计数均为可丢失数据（ADR-0007 纪律）：内存上限内 LRU 淘汰，
    # 会话本体双写 PG 兜底（src/lib/auth.ts），淘汰不造成登录态丢失
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 128m

  # 一次性迁移服务：deploy.sh 在 up 之前 compose run --rm 执行；
  # profile tools 使其不随 up -d 启动。镜像即 app 镜像（内含迁移件，
  # 见 Dockerfile），与本地 npm run db:migrate 同一 drizzle migrator 与记账表
  migrate:
    profiles: ["tools"]
    image: ${APP_IMAGE:-studybuddy-app:local}
    working_dir: /app
    command: ["node", "db-migrate.mjs"]
    env_file:
      - path: ./.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    # 反向代理（ADR-0016 入口层）：TLS 终止与唯一公网入口。
    # 钉 minor 线（ADR-0016 版本纪律）
    image: caddy:2.10-alpine
    restart: unless-stopped
    # 宿主端口可参数化：dev 用默认 80/443，test 共居同机改用 8080/8443（ADR-0018）
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    healthcheck:
      # 探容器内 80 端口：caddy 探活 = caddy 存活且上游 app 可达（502 会失败），
      # 使 compose up --wait 等到「整条链路」通才算部署完成
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 证书与 OCSP 状态持久化，避免每次重建容器重新签发
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  redis_data:
