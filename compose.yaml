# 部署编排（ADR-0016）。app + 反向代理两服务；PG / Redis / SeaweedFS 按应用
# 实际接入逐个补齐——拓扑终态仍以 ADR-0016 五服务为准，此为实施顺序而非架构变更。
#
# 镜像来自 TCR（ADR-0020）：APP_IMAGE 由 scripts/deploy.sh 注入
# （ccr.ccs.tencentyun.com/studybuddy/app:<短SHA>）。
# 本地体验：docker build --target runner -t studybuddy-app:local . 后直接 up（默认 tag 兜底）。
#
# dev/test 共居一台服务器（ADR-0018）：以不同 compose project
# （studybuddy-dev / studybuddy-test）+ 不同端口（80/443 与 8080/8443）区分。
services:
  app:
    image: ${APP_IMAGE:-studybuddy-app:local}
    restart: unless-stopped
    # 应用机密只经服务器本地 .env 注入（ADR-0016/0022：不进仓库、不进镜像、不过 CI）；
    # 骨架期文件不存在也可启动
    env_file:
      - path: ./.env
        required: false
    # 镜像内已默认 HOSTNAME=0.0.0.0 / PORT=3000，此处显式声明便于运维一眼可见
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    # 只在 compose 内网暴露，公网入口唯一是 caddy（ADR-0016）
    expose:
      - "3000"
    healthcheck:
      # node:alpine 自带 busybox wget；首页探活即可证明 server.js 存活
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          # 内存限额防共驻互抢（ADR-0018 开发/测试共居 2核4G 的纪律）
          memory: 1g

  caddy:
    # 反向代理（ADR-0016 入口层）：TLS 终止与唯一公网入口。
    # 钉 minor 线（ADR-0016 版本纪律）
    image: caddy:2.10-alpine
    restart: unless-stopped
    # 宿主端口可参数化：dev 用默认 80/443，test 共居同机改用 8080/8443（ADR-0018）
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    healthcheck:
      # 探容器内 80 端口：caddy 探活 = caddy 存活且上游 app 可达（502 会失败），
      # 使 compose up --wait 等到「整条链路」通才算部署完成
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 证书与 OCSP 状态持久化，避免每次重建容器重新签发
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
