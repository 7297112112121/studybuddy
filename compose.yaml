# 部署编排骨架（CI/CD 阶段 1，ADR-0016）。
# 本阶段只落 app + 反向代理两个服务；PG / Redis / SeaweedFS 按应用实际接入
# 逐个补齐——拓扑终态仍以 ADR-0016 五服务为准，此为实施顺序而非架构变更。
#
# 阶段 2 接入 TCR（ADR-0020）后：APP_IMAGE 指向
# ccr.ccs.tencentyun.com/studybuddy/app:<短SHA>，由 CI 推送，届时移除 build 段。
services:
  app:
    image: ${APP_IMAGE:-studybuddy-app:local}
    build:
      context: .
      # Dockerfile 的 runner 阶段（最终阶段，显式声明便于阅读）
      target: runner
    restart: unless-stopped
    # 应用机密只经服务器本地 .env 注入（ADR-0016/0022：不进仓库、不进镜像、不过 CI）；
    # 骨架期文件不存在也可启动
    env_file:
      - path: ./.env
        required: false
    # 镜像内已默认 HOSTNAME=0.0.0.0 / PORT=3000，此处显式声明便于运维一眼可见
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    # 只在 compose 内网暴露，公网入口唯一是 caddy（ADR-0016）
    expose:
      - "3000"
    healthcheck:
      # node:alpine 自带 busybox wget；首页探活即可证明 server.js 存活
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          # 内存限额防共驻互抢（ADR-0018 开发/测试共居 2核4G 的纪律）
          memory: 1g

  caddy:
    # 反向代理（ADR-0016 入口层）：TLS 终止与唯一公网入口。
    # 钉 minor 线（ADR-0016 版本纪律）
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 证书与 OCSP 状态持久化，避免每次重建容器重新签发
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
